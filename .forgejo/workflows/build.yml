name: Build Desktop App

# 触发条件：
# 1. 推送 v* tag（发布版本，例如 v1.0.0）
# 2. 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── Linux 构建（在自建 Docker runner 的宿主 Linux 上运行）────────────────────
  build-linux:
    name: Build · Linux
    # label 对应 forgejo-runner 注册时 --labels 的值
    runs-on: runner-1
    steps:
      - name: 检出代码
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: 安装 / 验证 Bun
        run: |
          if ! command -v bun &>/dev/null; then
            curl -fsSL https://bun.sh/install | bash
          fi
          # 确保 PATH 对当前 step 生效
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          bun --version

      - name: 安装 / 验证 Hutch
        run: |
          if ! command -v hutch &>/dev/null; then
            curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          fi
          hutch --version

      - name: 安装项目依赖
        run: bun install --frozen-lockfile

      - name: 构建 stable 安装包
        env:
          ELECTROBUN_BUILD_ENV: stable
        run: bun run desktop:build:stable

      - name: 上传构建产物
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: FantasticFrame-linux
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  # ─── 发布 Release ────────────────────────────────────────────────────────────
  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-linux]
    runs-on: self-hosted-linux
    steps:
      - name: 下载构建产物
        uses: https://data.forgejo.org/actions/download-artifact@v4
        with:
          path: dist/

      - name: 创建 Release 并上传产物
        uses: https://data.forgejo.org/forgejo/release-action@v0.1.3
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          release-name: ${{ github.ref_name }}
          tag-name: ${{ github.ref_name }}
          files: dist/**/*
          draft: false
          prerelease: false
