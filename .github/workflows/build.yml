name: Build Desktop App

# 触发条件：
# 1. 推送 v* tag → 构建全平台 + 发布 Release
# 2. 手动触发 → 可选单平台，只上传 artifact 不发 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '构建目标平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

jobs:
  # ─── Windows ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Build · Windows
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Hutch (Electrobun toolchain)
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          # Refresh PATH for subsequent steps
          echo "$env:USERPROFILE\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build stable package
        env:
          ELECTROBUN_BUILD_ENV: stable
        run: bun run desktop:build:stable

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FantasticFrame-windows
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ─── Linux ───────────────────────────────────────────────────────────────────
  build-linux:
    name: Build · Linux
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Hutch
        run: curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build stable package
        env:
          ELECTROBUN_BUILD_ENV: stable
        run: bun run desktop:build:stable

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FantasticFrame-linux
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ─── macOS ───────────────────────────────────────────────────────────────────
  build-macos:
    name: Build · macOS
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: brew install cmake

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Hutch
        run: curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build stable package
        env:
          ELECTROBUN_BUILD_ENV: stable
        run: bun run desktop:build:stable

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FantasticFrame-macos
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ─── Release（仅 tag push 时） ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release 和上传文件
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true   # 自动从 commit 生成 changelog
